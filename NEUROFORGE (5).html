<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEUROFORGE</title>
<style>
:root{--gl:#1d1245;--bg:#0b0a14;--card:#15132a;--tx:#ece9ff;--mu:#9a95c4;--vi:#8b5cf6;--cy:#22d3ee;--go:#fbbf24;--ok:#34d399;--ko:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 20% 0,var(--gl),var(--bg) 55%) fixed;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
#app{max-width:760px;margin:auto;padding:16px}h1,h2,h3{margin:.3em 0}h1{font-size:1.6rem;background:linear-gradient(90deg,var(--vi),var(--cy),var(--go));-webkit-background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid #2b2752;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button{background:#241f4d;color:var(--tx);border:1px solid #3b3480;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;min-height:44px}button:hover{border-color:var(--cy)}
button.pri{background:linear-gradient(90deg,var(--vi),#6366f1);border:0;font-weight:700}button.go{background:var(--go);color:#201500;border:0;font-weight:700}
input,textarea{width:100%;background:#0e0c20;color:var(--tx);border:1px solid #3b3480;border-radius:10px;padding:10px;font:inherit}textarea{min-height:130px}
.bar{height:10px;background:#0e0c20;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--cy))}
.mu{color:var(--mu);font-size:.9rem}.ok{color:var(--ok)}.ko{color:var(--ko)}.big{font-size:2rem;text-align:center;letter-spacing:.2em;font-weight:700;color:var(--cy)}
.tag{border:1px solid #3b3480;border-radius:20px;padding:1px 9px;font-size:.8rem;color:var(--mu)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.loot{animation:pop .6s ease-out;text-align:center;border:2px solid var(--c);box-shadow:0 0 24px var(--c)}@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.calm .loot{animation:none}@media(prefers-reduced-motion:reduce){.loot{animation:none}}pre{white-space:pre-wrap}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.card{background:linear-gradient(160deg,var(--card),#0b0919);box-shadow:0 6px 24px #0007}button{transition:transform .15s,border-color .15s}button:hover{transform:translateY(-2px)}.bar i{transition:width .8s}h1{text-shadow:0 0 28px var(--vi);letter-spacing:.05em}
@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.15)}75%{transform:rotate(14deg) scale(1.15)}}.chest{font-size:5rem;text-align:center;animation:shk .35s 4}.calm .chest{animation:none}@media(prefers-reduced-motion:reduce){.chest{animation:none}}
html.t1{--bg:#06141a;--card:#0c2530;--gl:#0b3a4d;--vi:#0ea5e9}html.t2{--bg:#1a0a0a;--card:#2a1212;--gl:#4a1220;--vi:#f43f5e}html.t3{--bg:#14110a;--card:#241e0e;--gl:#4a3510;--vi:#d97706}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(600px 320px at 85% 8%,#22d3ee26,transparent),radial-gradient(520px 320px at 8% 92%,#8b5cf633,transparent)}
.card:hover{border-color:var(--vi)}button.pri{box-shadow:0 0 20px #8b5cf67a}button.sel{border-color:var(--go);box-shadow:0 0 10px var(--go)}.st{display:flex;gap:6px;flex-wrap:wrap}.st button{flex:1;min-width:110px}.av{border-radius:50%;background:#0e0c20;border:3px solid var(--vi)}
button{background:linear-gradient(180deg,#2d2766,#1c1840);border:1px solid #4b42a8;box-shadow:inset 0 1px #ffffff26,0 3px 0 #0a0820;border-radius:12px;font-weight:600}button:active{transform:translateY(2px);box-shadow:inset 0 1px #fff2,0 1px 0 #0a0820}
button.pri{background:linear-gradient(135deg,#8b5cf6,#06b6d4);border:0;box-shadow:inset 0 1px #fff5,0 4px 0 #3b2a8c,0 0 22px #8b5cf688}button.go{background:linear-gradient(180deg,#fde68a,#f59e0b);box-shadow:inset 0 1px #fff8,0 4px 0 #92580a,0 0 18px #fbbf2466}
button.cta{animation:cta 1.8s ease-in-out infinite;font-size:1.15rem;padding:14px 26px}@keyframes cta{50%{transform:scale(1.06)}}button.sel{background:linear-gradient(180deg,#4c3fb8,#2d2766)}
.card{backdrop-filter:blur(6px);border-radius:18px}.bar{height:12px;border:1px solid #3b3480}.bar i{background:linear-gradient(90deg,var(--vi),var(--cy),var(--vi));background-size:200%;animation:sh 2.5s linear infinite}@keyframes sh{to{background-position:200%}}
#app>.row:not(.card):first-child{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg),transparent 12%);backdrop-filter:blur(10px);padding:8px;border-radius:16px;border:1px solid #2b2752}#app>.row:not(.card):first-child button{padding:6px 10px;min-height:38px;font-size:.85rem}h1{font-size:1.3rem}
#in{margin-top:12px;text-align:center}#in input{font-size:1.6rem;text-align:center}#in button{font-size:1.15rem}
.loot{position:relative;overflow:hidden;padding:18px}.loot::before{content:"";position:absolute;inset:-60%;background:conic-gradient(transparent,var(--c),transparent 25%,var(--c),transparent 50%,var(--c),transparent 75%);opacity:.22;animation:spin 7s linear infinite}.loot>*{position:relative}@keyframes spin{to{transform:rotate(1turn)}}
.fl{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-weight:800;font-size:2rem;color:var(--go);text-shadow:0 0 14px #fbbf24;pointer-events:none;z-index:20;animation:fl 1s ease-out forwards}@keyframes fl{to{transform:translate(-50%,-90px);opacity:0}}
.ov{position:fixed;inset:0;background:#05040df2;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1px 1px at 20px 30px,#fff8,transparent),radial-gradient(1.5px 1.5px at 120px 90px,#22d3ee99,transparent),radial-gradient(1px 1px at 200px 150px,#fbbf2499,transparent);background-size:240px 200px;animation:tw 5s ease-in-out infinite alternate}@keyframes tw{from{opacity:.3}to{opacity:1}}
.calm *,.calm ::before,.calm ::after{animation:none!important}@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important}}
</style></head><body><div id="app"></div><script>
const K='neuroforge1',$=s=>document.querySelector(s),ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[ri(0,a.length-1)];
const SK={calc:'Calcul',intu:'Intuition numérique',logi:'Logique & structures',mem:'Mémoire',oly:'Maîtrise olympique'};
const RK=['Novice','Apprenti','Adepte','Expert','Maître','Légende'];
const RAR=[['Commun',50,'#9ca3af'],['Peu commun',25,'#34d399'],['Rare',14,'#22d3ee'],['Épique',7,'#a855f7'],['Légendaire',3.5,'#fbbf24'],['Mythique',.5,'#f43f5e']];
const today=()=>new Date().toISOString().slice(0,10);
function def(){const s={};for(const k in SK)s[k]={ok:0,n:0,d:1,t:[],sOk:0,sKo:0,max:1,hints:0};return{xp:0,streak:0,best:0,last:'',inv:[],sk:s,notes:{},opt:{timer:true,calm:false},sess:0,rec:0,q:{day:'',s:0,c:0,o:0}}}
let S=def();try{const l=JSON.parse(localStorage.getItem(K));if(l&&l.sk)S=Object.assign(def(),l)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const lvl=x=>Math.floor(Math.sqrt(x/50))+1;
function Q0(){if(S.q.day!==today())S.q={day:today(),s:0,c:0,o:0}}
// ---------- Générateurs ----------
const G={
calc(d){const t=pick(d<2?[0,1]:[0,1,2,3]);
if(t==0){const a=ri(10**d,10**(d+1)),b=ri(10**d,10**(d+1));return{t:`${a} + ${b} = ?`,a:a+b+'',ex:`Additionne les centaines/dizaines séparément puis regroupe.`}}
if(t==1){const a=ri(6,9+d*4),b=ri(6,9+d*3),u=b%10,h=b-u;return{t:`${a} × ${b} = ?`,a:a*b+'',ex:`Décompose : ${a}×${h} + ${a}×${u} = ${a*h} + ${a*u}.`}}
if(t==2){const p=pick([5,10,15,20,25,30,40]),n=ri(2,20)*20;return{t:`${p} % de ${n} = ?`,a:p*n/100+'',ex:`${p}% de ${n} = ${p}×${n}/100.`}}
const m=ri(1,9+d*2);return{t:`${10*m+5}² = ?`,a:m*(m+1)*100+25+'',ex:`(10m+5)² = 100·m(m+1)+25 avec m=${m} : ${m}×${m+1}=${m*(m+1)}, puis on écrit 25 à la fin.`}},
intu(d){let x,y,k,A,B;do{x=ri(12,30+d*10);y=ri(12,30+d*10);k=ri(1,3);A=x*y;B=(x+k)*(y-k)}while(A==B||y-k<2);
const a1=`${x} × ${y}`,b1=`${x+k} × ${y-k}`;return{t:`Sans tout calculer, lequel est le plus grand ?`,ch:[a1,b1],a:A>B?a1:b1,ex:`Les deux produits ont la même somme de facteurs (${x+y}) : le produit est le plus grand quand les facteurs sont les plus proches. Ici ${A} contre ${B}.`}},
logi(d){const t=ri(0,Math.min(d,3)-1);
if(t==0){const a=ri(2,30),r=ri(2,9),u=[0,1,2,3].map(i=>a+i*r);return{t:`Suite : ${u.join(', ')}, ?`,a:a+4*r+'',ex:`Raison arithmétique +${r}.`}}
if(t==1){const a=ri(1,5),r=ri(2,4),u=[0,1,2,3].map(i=>a*r**i);return{t:`Suite : ${u.join(', ')}, ?`,a:a*r**4+'',ex:`Raison géométrique ×${r}.`}}
const c=ri(0,9),u=[1,2,3,4].map(n=>n*n+c);return{t:`Suite : ${u.join(', ')}, ?`,a:25+c+'',ex:`Les termes valent n²+${c} : le suivant est 5²+${c}. Les différences (3,5,7) augmentent de 2 : signature d’un carré.`}},
mem(d){const n=3+d;let s='';for(let i=0;i<n;i++)s+=ri(0,9);return{t:`Retiens la séquence, puis tape-la à l’envers.`,mem:s,a:[...s].reverse().join(''),ex:`Séquence : ${s}. Regroupe par blocs de 2-3 chiffres pour mieux la retenir.`}}};
// ---------- Problèmes (originaux) ----------
const P=[
{id:'o1',t:'Trois consécutifs',th:'Arithmétique',lv:1,min:10,s:`Montrer que pour tout entier n, n³ − n est divisible par 6.`,h:[`Factorise n³ − n.`,`Tu obtiens (n−1)n(n+1) : trois entiers consécutifs.`,`Parmi eux, un est multiple de 3 et au moins un est pair.`],sol:`n³−n = (n−1)n(n+1). Parmi trois entiers consécutifs, l’un est multiple de 3 et au moins l’un est pair. Comme 2 et 3 sont premiers entre eux, le produit est divisible par 2×3 = 6. ∎`},
{id:'o2',t:'Un diviseur qui se cache',th:'Divisibilité',lv:2,min:20,s:`Trouver tous les entiers naturels n tels que n + 3 divise n² + 7.`,h:[`Fais apparaître n+3 dans n²+7.`,`n²+7 = (n+3)(n−3) + 16.`,`Donc n+3 doit diviser 16.`],sol:`n²+7 = (n+3)(n−3)+16, donc n+3 | 16. Comme n+3 ≥ 3, n+3 ∈ {4, 8, 16}, soit n ∈ {1, 5, 13}. Vérification : 1²+7=8=2×4 ; 5²+7=32=4×8 ; 13²+7=176=11×16. Réponse : n = 1, 5 ou 13.`},
{id:'o3',t:'Somme de carrés',th:'Inégalités',lv:1,min:15,s:`Pour tous réels a, b, c, montrer que a² + b² + c² ≥ ab + bc + ca. Quand y a-t-il égalité ?`,h:[`Passe tout du même côté.`,`Multiplie par 2.`,`Reconnais (a−b)² + (b−c)² + (c−a)².`],sol:`2(a²+b²+c²−ab−bc−ca) = (a−b)²+(b−c)²+(c−a)² ≥ 0. Égalité si et seulement si a = b = c. ∎`},
{id:'o4',t:'Tiroirs modulo 4',th:'Tiroirs',lv:1,min:10,s:`Parmi 5 entiers quelconques, montrer qu’il en existe deux dont la différence est divisible par 4.`,h:[`Quels restes possibles dans la division par 4 ?`,`Combien de « tiroirs » ? Combien d’entiers ?`],sol:`Il y a 4 restes possibles modulo 4 (tiroirs) pour 5 entiers : deux entiers ont le même reste, donc leur différence est divisible par 4. ∎`},
{id:'o5',t:'Échiquier mutilé',th:'Invariants',lv:2,min:25,s:`On retire deux coins opposés d’un échiquier 8×8. Peut-on paver les 62 cases restantes avec des dominos 2×1 ?`,h:[`Colorie l’échiquier comme d’habitude.`,`Que couvre un domino, en termes de couleurs ?`,`Compte les cases de chaque couleur après retrait.`],sol:`Non. Des coins opposés ont la même couleur : il reste 32 cases d’une couleur et 30 de l’autre. Or chaque domino couvre exactement une case de chaque couleur : 31 dominos couvriraient 31 + 31 cases. Contradiction. ∎`},
{id:'o6',t:'Récurrence affine',th:'Suites',lv:2,min:20,s:`Soit u₀ = 1 et uₙ₊₁ = 2uₙ + 1. Conjecturer puis démontrer une formule pour uₙ.`,h:[`Calcule u₁, u₂, u₃, u₄.`,`Compare avec les puissances de 2.`,`Démontre ta conjecture par récurrence.`],sol:`On trouve 1, 3, 7, 15, 31 : conjecture uₙ = 2ⁿ⁺¹ − 1. Initialisation : u₀ = 1 = 2¹−1. Hérédité : si uₙ = 2ⁿ⁺¹−1 alors uₙ₊₁ = 2(2ⁿ⁺¹−1)+1 = 2ⁿ⁺²−1. ∎`},
{id:'o7',t:'Les diviseurs de 360',th:'Dénombrement',lv:1,min:10,s:`Combien 360 a-t-il de diviseurs positifs ? Justifier la méthode.`,h:[`Décompose 360 en facteurs premiers.`,`Un diviseur est de la forme 2ᵃ3ᵇ5ᶜ.`],sol:`360 = 2³·3²·5. Un diviseur est 2ᵃ3ᵇ5ᶜ avec a∈{0..3}, b∈{0..2}, c∈{0,1} : 4×3×2 = 24 diviseurs.`}];
// ---------- Loot ----------
function chest(min=0){let r=Math.random()*100,i=0,a=0;for(;i<6;i++){a+=RAR[i][1];if(r<a)break}i=Math.max(Math.min(i,5),min);
const it={n:pick(['Relique','Familier','Cadre','Titre','Thème'])+' '+pick(['du Théorème','de Fermat','d’Euler','des Premiers','de l’Invariant','du Tiroir','de la Récurrence','de Gauss']),r:i};
const e=S.inv.find(x=>x.n==it.n&&x.r==i);e?e.c++:S.inv.push({...it,c:1});S.last=it;return it}
const lootH=it=>`<div class="card loot" style="--c:${RAR[it.r][2]}"><div class="mu">${RAR[it.r][0]}</div><b>${it.n}</b></div>`;
// ---------- Rendu ----------
let V='home',se=null,tm=null,cp=null;
const sRank=k=>{const s=S.sk[k],acc=s.n?s.ok/s.n:0;return Math.min(5,Math.floor(Math.sqrt(s.ok/4)*(acc>=.7?1:.6)))};
const med=a=>{if(!a.length)return'–';const b=[...a].sort((x,y)=>x-y);return(b[b.length>>1]/1000).toFixed(1)+' s'};
function R(){clearInterval(tm);document.body.className=S.opt.calm?'calm':'';const A=$('#app');
const nav=`<div class="row sp"><h1>⚡ NEUROFORGE</h1><div class="row"><button onclick="V='home';R()">Accueil</button><button onclick="V='oly';R()">Olympiade</button><button onclick="V='inv';R()">Inventaire</button><button onclick="V='st';R()">Stats</button></div></div>`;
let b='';
if(V=='home'){Q0();const L=lvl(S.xp),a=50*(L-1)**2,n=50*L*L,qs=[['Terminer 1 session',S.q.s>=1],['Atteindre un combo de 5',S.q.c>=5],['Travailler 1 problème olympique',S.q.o>=1]];
b=`<div class="card"><div class="row sp"><h2>Niveau ${L}</h2><span class="mu">🔥 série ${S.streak} j · record ${S.best}</span></div><div class="bar"><i style="width:${(S.xp-a)/(n-a)*100}%"></i></div><div class="mu">${S.xp} / ${n} XP</div></div>
<div class="card"><h3>Lancer une session (10 questions)</h3><div class="row"><button class="pri" onclick="go('mix')">▶ Session mixte</button><button onclick="go('calc')">Calcul</button><button onclick="go('intu')">Intuition</button><button onclick="go('logi')">Logique</button><button onclick="go('mem')">Mémoire</button></div></div>
<div class="card"><h3>Compétences</h3>${Object.keys(SK).map(k=>`<div class="row sp"><span>${SK[k]}</span><span class="mu">${RK[sRank(k)]} · diff. ${S.sk[k].d}</span></div>`).join('')}</div>
<div class="card"><h3>Quêtes du jour</h3>${qs.map(q=>`<div class="${q[1]?'ok':''}">${q[1]?'✔':'○'} ${q[0]}</div>`).join('')}</div>
${S.last?`<div class="mu">Dernier loot</div>${lootH(S.last)}`:''}`}
if(V=='q'){const c=se.cur;b=`<div class="card"><div class="row sp"><span class="tag">Question ${se.i+1}/10</span><span>Combo ×${(1+Math.min(se.combo,10)*.1).toFixed(1)}</span><span id="tm" class="mu"></span></div><h2>${c.t}</h2><div id="mm" class="big"></div><div id="in">${c.ch&&!c.fb?c.ch.map(x=>`<button onclick="sub(this.textContent)" style="margin:4px">${x}</button>`).join(''):''}</div>
${c.fb?`<p class="${c.fb.ok?'ok':'ko'}"><b>${c.fb.ok?'Juste ! +'+c.fb.xp+' XP':'Réponse : '+c.a}</b></p><p>${c.ex}</p><button class="pri" onclick="nxt()">Suivant →</button>`:''}</div>`}
if(V=='end'){b=`<div class="card"><h2>Session terminée</h2><p>${se.ok}/10 correctes · +${se.xp} XP · meilleur combo ${se.bc}</p><div id="lt"><div class="chest" aria-label="Coffre">🎁</div></div><button class="pri" onclick="V='home';R()">Continuer</button></div>`}
if(V=='oly'){b=`<h2>Olympiade</h2><p class="mu">Problèmes originaux NEUROFORGE (aucun n’est un sujet officiel). Pour les vrais sujets, consulte Animath et la POFM.</p>${P.map(p=>{const n=S.notes[p.id]||{};return`<div class="card row sp"><div><b>${p.t}</b> <span class="tag">${p.th}</span> <span class="tag">niv. ${p.lv}</span> <span class="tag">~${p.min} min</span> ${n.done?'<span class="ok">✔ résolu</span>':n.d?'<span class="mu">brouillon en cours</span>':''}</div><button onclick="op('${p.id}')">Ouvrir</button></div>`}).join('')}`}
if(V=='p'){const p=P.find(x=>x.id==cp),n=S.notes[cp]||(S.notes[cp]={d:'',c:'',h:0,seen:false,done:false});
b=`<button onclick="V='oly';R()">← Problèmes</button><div class="card"><h2>${p.t}</h2><span class="tag">Original NEUROFORGE</span> <span class="tag">${p.th}</span><p>${p.s}</p>
<label class="mu">Brouillon / démonstration (sauvegarde automatique)</label><textarea oninput="nt('d',this.value)">${n.d}</textarea><label class="mu">Conjectures & notes</label><textarea style="min-height:70px" oninput="nt('c',this.value)">${n.c}</textarea></div>
<div class="card"><div class="row"><button onclick="hint()">💡 Indice (${n.h}/${p.h.length})</button><button onclick="sol()">Voir la solution</button>${n.done?'':`<button class="go" onclick="fin()">J’ai résolu ce problème</button>`}</div>${p.h.slice(0,n.h).map((h,i)=>`<p>${i+1}. ${h}</p>`).join('')}${n.seen?`<hr><b>Solution</b><p>${p.sol}</p>`:''}<p class="mu">L’XP olympique repose sur ton auto-évaluation : relis honnêtement ta preuve avant de valider.</p></div>`}
if(V=='inv'){b=`<h2>Inventaire (${S.inv.length})</h2><p class="mu">Objets purement cosmétiques.</p><div class="grid">${S.inv.map((i,x)=>`<div class="card" style="border-color:${RAR[i.r][2]}"><div class="mu">${RAR[i.r][0]} · ${TY[i.ty]||'Objet'}</div><b>${i.n}</b> ×${i.c}${['th','ti','fr','fa'].includes(i.ty)?`<br><button onclick="eqp(${x})">${S.eq&&S.eq[i.ty]==x?'✔ Équipé':'Équiper'}</button>`:''}</div>`).join('')||'Aucun objet : termine une session !'}</div>`}
if(V=='st'){b=`<h2>Statistiques</h2><p class="mu">Performances observées sur les compétences entraînées, pas une mesure d’intelligence.</p>${Object.keys(SK).map(k=>{const s=S.sk[k];return`<div class="card"><b>${SK[k]}</b> · ${RK[sRank(k)]}<br><span class="mu">Précision ${s.n?Math.round(100*s.ok/s.n):0} % (${s.ok}/${s.n}) · temps médian ${med(s.t)} · difficulté maîtrisée max ${s.max}${k=='oly'?' · indices '+s.hints:''}</span></div>`}).join('')}
<div class="card"><h3>Options</h3><label><input type="checkbox" style="width:auto" ${S.opt.timer?'checked':''} onchange="S.opt.timer=this.checked;save()"> Afficher le chronomètre</label><br><label><input type="checkbox" style="width:auto" ${S.opt.calm?'checked':''} onchange="S.opt.calm=this.checked;save();R()"> Animations réduites</label></div>

P.push({id:'o8',t:'Paires de somme 11',th:'Tiroirs',lv:2,min:15,s:`On choisit 6 nombres distincts parmi {1, 2, …, 10}. Montrer que deux d’entre eux ont pour somme 11.`,h:[`Forme des paires dont la somme vaut 11.`,`Combien de paires ? Combien de nombres choisis ?`],sol:`Les paires {1,10}, {2,9}, {3,8}, {4,7}, {5,6} sont 5 tiroirs qui partitionnent {1..10}. Avec 6 nombres, deux tombent dans la même paire ; étant distincts, ce sont les deux éléments de la paire, de somme 11. ∎`},
{id:'o9',t:'L’astuce de la factorisation',th:'Algèbre',lv:2,min:25,s:`Trouver tous les couples d’entiers naturels (x, y) tels que xy − 2x − 3y = 0.`,h:[`Ajoute une constante pour factoriser.`,`xy − 2x − 3y + 6 = (x − 3)(y − 2).`,`Énumère les diviseurs de 6, y compris négatifs, et garde les solutions naturelles.`],sol:`L’équation équivaut à (x−3)(y−2) = 6. Les paires de facteurs (a,b) de produit 6 donnent x=a+3, y=b+2. Avec a,b>0 : (4,8), (5,5), (6,4), (9,3). Avec a,b<0 : seule (a,b)=(−3,−2) donne x,y≥0, soit (0,0). Solutions : (0,0), (4,8), (5,5), (6,4), (9,3).`},
{id:'o10',t:'Un produit minoré',th:'Inégalités',lv:2,min:15,s:`Pour tous réels a, b strictement positifs, montrer que (a + b)(1/a + 1/b) ≥ 4.`,h:[`Développe le produit.`,`Tu obtiens 2 + a/b + b/a.`,`Montre que a/b + b/a ≥ 2.`],sol:`(a+b)(1/a+1/b) = 2 + a/b + b/a. Or a/b + b/a − 2 = (a−b)²/(ab) ≥ 0. Donc le produit est ≥ 4, avec égalité si et seulement si a = b. ∎`},
{id:'o11',t:'Effacer et remplacer',th:'Invariants',lv:2,min:25,s:`On écrit au tableau les nombres 1, 2, …, 10. À chaque étape, on efface deux nombres a et b et on écrit |a − b|. Après 9 étapes, un seul nombre reste. Peut-il être 0 ?`,h:[`Cherche une quantité qui ne change pas (ou pas de parité) à chaque étape.`,`Compare la parité de a + b et celle de |a − b|.`,`Que vaut la parité de la somme initiale ?`],sol:`Non. a+b et |a−b| ont la même parité, donc la parité de la somme des nombres au tableau est invariante. La somme initiale est 55, impaire : le dernier nombre est impair, donc différent de 0. ∎`},
{id:'o12',t:'Chiffres tous distincts',th:'Dénombrement',lv:1,min:10,s:`Combien existe-t-il d’entiers de 4 chiffres (le premier non nul) dont les quatre chiffres sont deux à deux distincts ?`,h:[`Choisis les chiffres l’un après l’autre.`,`Attention au premier chiffre, qui ne peut pas être 0.`],sol:`9 choix pour le premier chiffre (1 à 9), puis 9 pour le deuxième (0 à 9 sauf le premier), 8 pour le troisième, 7 pour le quatrième : 9×9×8×7 = 4536.`},
{id:'o13',t:'La médiane du triangle rectangle',th:'Géométrie',lv:2,min:20,s:`Dans un triangle ABC rectangle en A, montrer que la médiane issue de A vaut la moitié de l’hypoténuse BC.`,h:[`Cherche une construction auxiliaire : un cercle ou un rectangle.`,`Un angle droit inscrit dans un cercle intercepte un diamètre.`],sol:`Soit M le milieu de BC. Comme l’angle en A est droit, A appartient au cercle de diamètre BC, de centre M et de rayon BC/2. Donc MA = BC/2. (Autre preuve : compléter ABC en rectangle ABDC ; ses diagonales ont même longueur et se coupent en leur milieu M.) ∎`},
{id:'o14',t:'Carrés modulo 4',th:'Congruences',lv:2,min:15,s:`Montrer qu’un carré parfait n’est jamais congru à 3 modulo 4. En déduire que l’équation x² − 4y = 3 n’a aucune solution entière.`,h:[`Distingue n pair et n impair.`,`Écris n = 2k ou n = 2k + 1 et développe.`],sol:`Si n=2k, n²=4k²≡0. Si n=2k+1, n²=4k²+4k+1≡1 (mod 4). Jamais 3. Si x²−4y=3, alors x²≡3 (mod 4) : impossible. ∎`},
{id:'o15',t:'n⁵ − n',th:'Arithmétique',lv:3,min:40,s:`Montrer que pour tout entier n, n⁵ − n est divisible par 30.`,h:[`30 = 2 × 3 × 5 : trois divisibilités à établir.`,`Factorise : n⁵ − n = (n−1)n(n+1)(n²+1).`,`Pour 5, étudie n modulo 5 : 0, ±1, ±2.`],sol:`n⁵−n=(n−1)n(n+1)(n²+1). Le produit de trois consécutifs est divisible par 6. Modulo 5 : si n≡0 ou ±1, un des trois premiers facteurs est divisible par 5 ; si n≡±2, alors n²+1≡5≡0. Donc 5 divise n⁵−n. Comme 6 et 5 sont premiers entre eux, 30 divise n⁵−n. ∎`},
{id:'o16',t:'Produit égal à 1',th:'Inégalités',lv:3,min:30,s:`Soient a, b, c > 0 tels que abc = 1. Montrer que a + b + c ≥ 3.`,h:[`Pense à l’inégalité entre moyennes arithmétique et géométrique.`,`Pour trois réels positifs : (a+b+c)/3 ≥ (abc)^(1/3).`],sol:`Par l’inégalité arithmético-géométrique, (a+b+c)/3 ≥ ∛(abc) = 1, donc a+b+c ≥ 3, avec égalité si a=b=c=1. ∎`});

P.push({id:'o17',t:'n(n+1) est-il un carré ?',th:'Arithmétique',lv:2,min:20,s:`Trouver tous les entiers n ≥ 1 tels que n(n+1) soit un carré parfait.`,h:[`Encadre n(n+1) entre deux carrés consécutifs.`,`Compare n² + n avec n² et (n+1)².`],sol:`Pour n≥1, n² < n²+n < n²+2n+1 = (n+1)². Le nombre n(n+1) est strictement entre deux carrés consécutifs : ce n’est jamais un carré. Aucune solution. ∎`},
{id:'o18',t:'Deux points de même couleur',th:'Colorations',lv:2,min:15,s:`Chaque point du plan est colorié en rouge ou en bleu. Montrer qu’il existe deux points de même couleur à distance 1 l’un de l’autre.`,h:[`Choisis une figure simple dont tous les côtés valent 1.`,`Un triangle équilatéral de côté 1 a 3 sommets pour 2 couleurs.`],sol:`Prenons un triangle équilatéral de côté 1. Ses 3 sommets sont coloriés avec 2 couleurs : deux sommets ont la même couleur (tiroirs) et sont à distance 1. ∎`},
{id:'o19',t:'Une équation diophantienne',th:'Arithmétique',lv:1,min:15,s:`Trouver tous les couples d’entiers (x, y) tels que 3x + 5y = 1.`,h:[`Trouve une solution particulière.`,`Soustrais-la : 3(x−2) = −5(y+1).`,`Utilise le lemme de Gauss.`],sol:`(2, −1) est solution. Alors 3(x−2) = −5(y+1), donc 5 divise 3(x−2) ; 3 étant premier avec 5, 5 divise x−2 : x = 2+5k, puis y = −1−3k. Réciproquement ces couples conviennent. ∎`},
{id:'o20',t:'Somme de n·n!',th:'Récurrences',lv:2,min:25,s:`Montrer que pour tout n ≥ 1 : 1·1! + 2·2! + … + n·n! = (n+1)! − 1.`,h:[`Teste n = 1, 2, 3.`,`Démontre par récurrence.`,`Remarque que (n+1)·(n+1)! = (n+2)! − (n+1)!.`],sol:`n=1 : 1 = 2!−1. Hérédité : si la somme vaut (n+1)!−1, alors la somme à l’ordre n+1 vaut (n+1)!−1+(n+1)(n+1)! = (n+2)(n+1)!−1 = (n+2)!−1. ∎`},
{id:'o21',t:'Le jeu des allumettes',th:'Stratégies',lv:1,min:15,s:`21 allumettes sont sur une table. Deux joueurs retirent tour à tour 1, 2 ou 3 allumettes ; celui qui prend la dernière gagne. Qui a une stratégie gagnante ?`,h:[`Cherche les positions perdantes pour celui qui doit jouer.`,`4 allumettes : le joueur qui joue perd.`],sol:`Le premier joueur gagne. Il prend 1 allumette (il en reste 20), puis à chaque tour complète le coup adverse à 4 : il laisse toujours un multiple de 4 et prend la dernière. ∎`},
{id:'o22',t:'Sophie Germain',th:'Factorisations',lv:3,min:35,s:`Montrer que n⁴ + 4 n’est pas premier pour tout entier n ≥ 2.`,h:[`Fais apparaître une différence de deux carrés.`,`n⁴+4 = (n²+2)² − (2n)².`,`Vérifie que chaque facteur est > 1.`],sol:`n⁴+4 = (n²+2)²−(2n)² = (n²+2n+2)(n²−2n+2). Pour n≥2, n²−2n+2 = (n−1)²+1 ≥ 2, et n²+2n+2 > 2 : deux facteurs > 1, donc n⁴+4 est composé. ∎`});

P.push({id:'o23',t:'Un trinôme premier',th:'Arithmétique',lv:2,min:20,s:`Trouver tous les entiers n tels que n² − 5n + 6 soit un nombre premier.`,h:[`Factorise le trinôme.`,`Un produit de deux entiers qui vaut un nombre premier : l’un des facteurs vaut 1 ou −1.`],sol:`n²−5n+6 = (n−2)(n−3). Pour que ce produit soit premier, un facteur vaut ±1. n−2=1 (n=3) ou n−3=−1 (n=2) donnent 0 ; n−2=−1 (n=1) donne 2 ; n−3=1 (n=4) donne 2. Réponse : n = 1 ou n = 4.`},
{id:'o24',t:'Ni 2, ni 3, ni 5',th:'Dénombrement',lv:2,min:25,s:`Combien d’entiers de 1 à 1000 ne sont divisibles ni par 2, ni par 3, ni par 5 ?`,h:[`Compte les multiples de 2, 3 et 5 puis corrige les doubles comptages.`,`Utilise le principe d’inclusion-exclusion avec les multiples de 6, 10, 15 et 30.`],sol:`Multiples : 500 (2), 333 (3), 200 (5) ; de 6 : 166, de 10 : 100, de 15 : 66 ; de 30 : 33. Divisibles par 2, 3 ou 5 : 1033 − 332 + 33 = 734. Réponse : 1000 − 734 = 266.`},
{id:'o25',t:'Diagonales égales',th:'Géométrie',lv:1,min:15,s:`Un parallélogramme ABCD a ses deux diagonales de même longueur. Montrer que c’est un rectangle.`,h:[`Compare les triangles ABD et DCA.`,`Que dire des angles en A et en D ?`],sol:`Dans ABD et DCA : AB=DC, AD=DA, BD=AC. Les triangles sont isométriques (trois côtés), donc ∠BAD = ∠CDA. Or ces angles sont supplémentaires car (AB)//(DC). Chacun vaut 90° : ABCD est un rectangle. ∎`},
{id:'o26',t:'Cubes et produits croisés',th:'Inégalités',lv:2,min:20,s:`Pour tous réels a, b > 0, montrer que a³ + b³ ≥ a²b + ab².`,h:[`Passe tout dans le membre de gauche.`,`Factorise par (a + b).`],sol:`a³+b³−a²b−ab² = (a+b)(a−b)² ≥ 0 car a+b>0. Égalité si et seulement si a=b. ∎`},
{id:'o27',t:'Le tour du cavalier',th:'Invariants',lv:2,min:20,s:`Un cavalier d’échecs part de a1. Peut-il atteindre h8 en exactement 63 coups ?`,h:[`Colorie l’échiquier.`,`Que se passe-t-il pour la couleur de la case à chaque coup ?`,`a1 et h8 ont-elles la même couleur ?`],sol:`Non. Un coup de cavalier change toujours la couleur de la case. a1 et h8 ont la même couleur, donc le nombre de coups est pair. 63 est impair : impossible. ∎`},
{id:'o28',t:'Termes consécutifs premiers entre eux',th:'Suites',lv:2,min:25,s:`Soit u₁ = 1, u₂ = 2 et uₙ₊₂ = uₙ₊₁ + uₙ. Montrer que uₙ et uₙ₊₁ sont premiers entre eux pour tout n ≥ 1.`,h:[`Calcule les premiers termes.`,`Relie pgcd(uₙ₊₂, uₙ₊₁) à pgcd(uₙ₊₁, uₙ).`],sol:`pgcd(uₙ₊₂,uₙ₊₁) = pgcd(uₙ₊₁+uₙ, uₙ₊₁) = pgcd(uₙ,uₙ₊₁). Ce pgcd est donc constant, égal à pgcd(u₁,u₂)=pgcd(1,2)=1. ∎`},
{id:'o29',t:'Le facteur 7',th:'Congruences',lv:2,min:25,s:`Montrer que pour tout entier n ≥ 0, 7 divise 3²ⁿ⁺¹ + 2ⁿ⁺².`,h:[`Écris 3²ⁿ⁺¹ = 3·9ⁿ.`,`Que vaut 9 modulo 7 ?`],sol:`3²ⁿ⁺¹ = 3·9ⁿ ≡ 3·2ⁿ (mod 7) et 2ⁿ⁺² = 4·2ⁿ. La somme est ≡ 7·2ⁿ ≡ 0 (mod 7). ∎`},
{id:'o30',t:'Six personnes',th:'Combinatoire',lv:3,min:40,s:`Dans un groupe de 6 personnes, la relation « se connaître » est symétrique. Montrer qu’il existe 3 personnes qui se connaissent toutes entre elles, ou 3 qui ne se connaissent pas du tout.`,h:[`Isole une personne A et regarde ses 5 relations.`,`Principe des tiroirs : au moins 3 personnes dans la même catégorie.`,`Distingue deux cas selon que ces 3 personnes connaissent A ou non.`],sol:`Soit A. Parmi les 5 autres, au moins 3 la connaissent ou au moins 3 ne la connaissent pas. Cas 1 : B, C, D connaissent A. Si deux d’entre eux se connaissent, ils forment avec A un triplet de connaissances ; sinon B, C, D ne se connaissent pas entre eux. Cas 2 : symétrique en échangeant les rôles. ∎`},
{id:'o31',t:'Une somme de carrés nulle',th:'Algèbre',lv:1,min:15,s:`Trouver tous les réels x, y tels que x² + y² − 2x + 4y + 5 = 0.`,h:[`Regroupe les termes en x et en y.`,`Reconnais deux carrés parfaits.`],sol:`L’équation s’écrit (x−1)² + (y+2)² = 0. Une somme de deux carrés est nulle si et seulement si chacun l’est : x=1 et y=−2.`},
{id:'o32',t:'Au moins une femme',th:'Dénombrement',lv:1,min:10,s:`Combien de comités de 3 personnes peut-on former parmi 5 hommes et 4 femmes, avec au moins une femme ?`,h:[`Compte tous les comités, puis ceux qui n’en ont aucune.`],sol:`Tous les comités : C(9,3)=84. Sans femme : C(5,3)=10. Réponse : 84 − 10 = 74.`});

P.push({id:'o33',t:'Un carré impair moins 1',th:'Congruences',lv:1,min:10,s:`Montrer que si n est un entier impair, alors n² − 1 est divisible par 8.`,h:[`Écris n = 2k + 1.`,`Factorise : n²−1 = 4k(k+1).`],sol:`n²−1 = (2k+1)²−1 = 4k(k+1). Le produit k(k+1) de deux entiers consécutifs est pair, donc 8 divise 4k(k+1). ∎`},
{id:'o34',t:'Les poignées de main',th:'Invariants',lv:2,min:25,s:`Lors d’une réunion, certaines personnes se serrent la main. Montrer que le nombre de personnes ayant serré un nombre impair de mains est pair.`,h:[`Compte les poignées de main de deux façons.`,`Que vaut la somme, sur toutes les personnes, du nombre de mains serrées ?`],sol:`Chaque poignée de main est comptée deux fois dans la somme S des nombres de mains serrées : S = 2 × (nombre de poignées), donc S est paire. Une somme d’entiers n’est paire que si elle contient un nombre pair de termes impairs. ∎`},
{id:'o35',t:'Différence de carrés',th:'Équations en entiers',lv:2,min:25,s:`Trouver tous les couples d’entiers (x, y) tels que x² − y² = 15.`,h:[`Factorise : (x−y)(x+y) = 15.`,`x−y et x+y ont même parité ; liste les diviseurs de 15, positifs et négatifs.`],sol:`(x−y)(x+y)=15 avec x=(a+b)/2, y=(b−a)/2 pour a·b=15 (a,b impairs). Les couples (a,b) : (1,15), (3,5), (5,3), (15,1) et leurs opposés. Solutions : (±8, ±7) et (±4, ±1), soit 8 couples. Vérif. : 64−49 = 16−1 = 15.`},
{id:'o36',t:'Critère de divisibilité par 9',th:'Congruences',lv:1,min:15,s:`Montrer qu’un entier est divisible par 9 si et seulement si la somme de ses chiffres l’est.`,h:[`Que vaut 10 modulo 9 ?`,`Écris N = a₀ + 10a₁ + 100a₂ + …`],sol:`Comme 10 ≡ 1 (mod 9), 10ᵏ ≡ 1 pour tout k. Donc N = Σ aᵢ 10ⁱ ≡ Σ aᵢ (mod 9) : N et la somme de ses chiffres ont le même reste modulo 9. ∎`},
{id:'o37',t:'Trois fractions cycliques',th:'Inégalités',lv:3,min:30,s:`Soient a, b, c > 0. Montrer que a/b + b/c + c/a ≥ 3.`,h:[`Calcule le produit des trois fractions.`,`Applique l’inégalité arithmético-géométrique à trois termes.`],sol:`Les trois nombres positifs a/b, b/c, c/a ont pour produit 1. Par AM-GM, (a/b+b/c+c/a)/3 ≥ ∛1 = 1, donc la somme est ≥ 3, avec égalité si a=b=c. ∎`},
{id:'o38',t:'Multiples de 7',th:'Dénombrement',lv:1,min:10,s:`Combien d’entiers à trois chiffres sont des multiples de 7 ?`,h:[`Compte les multiples de 7 jusqu’à 999 puis jusqu’à 99.`],sol:`Multiples de 7 ≤ 999 : ⌊999/7⌋ = 142. Multiples de 7 ≤ 99 : ⌊99/7⌋ = 14. Réponse : 142 − 14 = 128.`},
{id:'o39',t:'n! contre 2ⁿ',th:'Récurrences',lv:1,min:15,s:`Montrer que pour tout entier n ≥ 4, n! > 2ⁿ.`,h:[`Initialise à n = 4.`,`Dans l’hérédité, multiplie l’inégalité par n+1.`],sol:`n=4 : 24 > 16. Hérédité : si n! > 2ⁿ, alors (n+1)! = (n+1)·n! > (n+1)·2ⁿ ≥ 2·2ⁿ = 2ⁿ⁺¹ car n+1 ≥ 2. ∎`});

function rn(i){const v=prompt('Nom du familier ?');if(v){pd(S.inv[i].n).nick=v.slice(0,16);save();R()}}
function petsH(){const f=S.inv.map((it,i)=>[it,i]).filter(([it])=>it.ty=='fa');if(!f.length)return`<div class='card mu'>Aucun familier : ouvre des coffres pour en trouver !</div>`;return'<h2>Familiers</h2>'+f.map(([it,i])=>{const n=it.n,d=pd(n),l=petLv((S.pets||{})[n]||0),em=n.split(' ')[0],on=S.eq&&S.eq.fa==i;return`<div class='card' ${on?`style='border-color:var(--go)'`:''}><div class='row sp'><div><span style='font-size:34px'>${d.hat||''}${em}</span> <b>${d.nick||n.slice(em.length+1)}</b> <span class='tag'>niv. ${l}</span></div><div class='row'><button onclick='eqp(${i})'>${on?'✔ Actif':'Choisir'}</button><button onclick='rn(${i})' aria-label='Renommer'>✏️</button></div></div><div class='row' style='margin-top:6px'>${HATS.map((h,j)=>`<button class='${d.hat==h[0]?'sel':''}' onclick='setHat(${i},${j})'>${h[0]||'∅'}${l<h[2]?' 🔒'+h[2]:''}</button>`).join('')}</div></div>`}).join('')}
const R4=R;R=function(){ensure();R4();const A=$('#app');
if(V=='home'){const b=A.querySelector('button[onclick*=mix]');if(b)b.parentElement.insertAdjacentHTML('beforeend',`<button onclick="go('expt')">∑ Maths expertes</button><button onclick="go('puz')">🧩 Casse-têtes</button>`)}
if(V=='av'){const a=av(),L=lvl(S.xp);A.insertAdjacentHTML('beforeend',[['Aura','bg',['Aucune',...BGC.slice(1)],[1,1,3,5,7,10]],['Cape','cp',['Aucune',...CPC.slice(1)],[1,1,2,4,6,8]],['Yeux','ey',EY,[1,1,2,4]]].map(([t,k,vs,nd])=>`<div class='card'><b>${t}</b><div class='row' style='margin-top:6px'>${vs.map((v,i)=>{const c=v[0]=='#';return`<button class='${(a[k]||0)==i?'sel':''}' style='${c?'background:'+v+';min-width:44px':''}' aria-label='${c?t+' '+(i+1):v}' onclick='setAv("${k}",${i},${nd[i]})'>${c?(nd[i]>L?'🔒':(a[k]||0)==i?'✔':''):v+(nd[i]>L?' 🔒'+nd[i]:'')}</button>`}).join('')}</div></div>`).join('')+petsH())}};
R();
</script></body></html>
